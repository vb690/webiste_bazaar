project:
  type: website
  output-dir: docs

website:
  title: "Bazaar"
  page-navigation: true
  reader-mode: true

  navbar:
    background: primary
    search: true
    left:
      - text: "Home"
        href: index.qmd
      - text: "Tutorials"
        href: posts/tutorials/index.qmd
      - text: "Blog Posts"
        href: posts/blog_posts/index.qmd
  
  sidebar:
    - contents:
      - text: "Tutorials"
        href: posts/tutorials/index.qmd

      - text: "Blog"
        href: posts/blog_posts/index.qmd

format:
  html:
    theme: minty
    css: styles.css

toc: true
toc-title: "What's on this page"
number-sections: true

# Never re-execute a notebook on a full render unless its .qmd changed, and when it
# did, reuse cached cell outputs if only prose changed (needs `jupyter-cache`).
# Note: `quarto render <file>.qmd` / previewing a single file always re-executes it.
execute:
  freeze: auto
  cache: true
